[PassList]
; Support portect1, protect2 and persist skip 8MB aligned adjustment if not necessary.
; select True means skip; False means do 8MB aligned.
protect1 = False
protect2 = False
persist = False

[AlignPartList_OTA]
; define aligned partition while MTK_AB_OTA_UPDATER flag set
oemkeystore = 8388608
system = 8388608
super = 8388608
cache   = 8388608
userdata = 8388608
intsd     = 8388608
[AlignPartList]
; define aligned partition while MTK_AB_OTA_UPDATER flag do not set
system = 8388608
super = 8388608
cache   = 8388608
userdata = 8388608
intsd     = 8388608

[gptLBAR]
;set True means reserve the LBAR in binary files; False means do not.
enable = True
